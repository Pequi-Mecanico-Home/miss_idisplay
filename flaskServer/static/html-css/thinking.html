<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>thinking</title>
    <style>
        .thought-bubble {
            animation: bubble-float 3s ease-in-out infinite;
            transform-origin: center center;
            transform-box: fill-box;
        }
        @keyframes bubble-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .bubble-dot {
            animation: dot-pop 2s ease-in-out infinite;
            transform-origin: center center;
            transform-box: fill-box;
        }
        .bubble-dot2 { animation-delay: 0.3s; }
        .bubble-dot3 { animation-delay: 0.6s; }
        @keyframes dot-pop {
            0%, 100% { transform: scale(0.7); opacity: 0.4; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }
        .loading-dots {
            animation: dots-blink 1.4s ease-in-out infinite;
        }
        .ld2 { animation-delay: 0.2s; }
        .ld3 { animation-delay: 0.4s; }
        @keyframes dots-blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -10 1124 620" preserveAspectRatio="xMidYMid meet">
        <image class="nose" href="/static/svg/nose.svg" x="398" y="312"/>
        <image class="idle" href="/static/svg/idle.svg" x="110" y="40"/>
        <image class="normal" href="/static/svg/normal.svg" x="330" y="120"/>

        <!-- Small thought dots leading to bubble -->
        <circle class="bubble-dot" cx="690" cy="270" r="8" fill="rgba(59,130,246,0.5)" stroke="rgba(59,130,246,0.7)" stroke-width="2"/>
        <circle class="bubble-dot bubble-dot2" cx="720" cy="230" r="13" fill="rgba(59,130,246,0.4)" stroke="rgba(59,130,246,0.6)" stroke-width="2"/>
        <circle class="bubble-dot bubble-dot3" cx="755" cy="190" r="18" fill="rgba(59,130,246,0.3)" stroke="rgba(59,130,246,0.5)" stroke-width="2"/>

        <!-- Thought bubble cloud (smaller, lower) -->
        <g class="thought-bubble">
            <ellipse cx="830" cy="140" rx="72" ry="40" fill="rgba(255,255,255,0.85)" stroke="rgba(59,130,246,0.6)" stroke-width="3"/>
            <ellipse cx="800" cy="128" rx="30" ry="26" fill="rgba(255,255,255,0.85)"/>
            <ellipse cx="860" cy="128" rx="30" ry="26" fill="rgba(255,255,255,0.85)"/>
            <ellipse cx="810" cy="158" rx="26" ry="18" fill="rgba(255,255,255,0.85)"/>
            <ellipse cx="850" cy="158" rx="26" ry="18" fill="rgba(255,255,255,0.85)"/>
            <ellipse cx="830" cy="115" rx="26" ry="18" fill="rgba(255,255,255,0.85)"/>
            <!-- Loading dots inside bubble -->
            <circle class="loading-dots" cx="810" cy="140" r="6" fill="rgba(59,130,246,0.8)"/>
            <circle class="loading-dots ld2" cx="830" cy="140" r="6" fill="rgba(59,130,246,0.8)"/>
            <circle class="loading-dots ld3" cx="850" cy="140" r="6" fill="rgba(59,130,246,0.8)"/>
        </g>
    </svg>
</body>
</html>
