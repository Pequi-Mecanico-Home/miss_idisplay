<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>following</title>
    <style>
        /* Body leans forward (eager follow) */
        .follow-body {
            animation: follow-lean 2s ease-in-out infinite;
            transform-origin: center bottom;
            transform-box: fill-box;
        }

        .follow-eyes {
            animation: follow-lean 2s ease-in-out infinite;
            transform-origin: center bottom;
            transform-box: fill-box;
        }

        .follow-nose {
            animation: follow-lean 2s ease-in-out infinite;
            transform-origin: center bottom;
            transform-box: fill-box;
        }

        @keyframes follow-lean {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-8px) scale(1.02);
            }
        }

        /* Tracking crosshair on left eye */
        .crosshair {
            animation: crosshair-lock 2s ease-in-out infinite;
            transform-origin: center center;
            transform-box: fill-box;
        }

        @keyframes crosshair-lock {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.08);
            }
        }

        /* Speed motion lines */
        .speed-line {
            animation: speed-dash 1.6s ease-in-out infinite;
        }

        .sl2 {
            animation-delay: 0.3s;
        }

        .sl3 {
            animation-delay: 0.6s;
        }

        .sl4 {
            animation-delay: 0.9s;
        }

        .sl5 {
            animation-delay: 1.2s;
        }

        @keyframes speed-dash {
            0% {
                opacity: 0;
                transform: translateX(20px);
            }

            30% {
                opacity: 0.7;
                transform: translateX(0);
            }

            100% {
                opacity: 0;
                transform: translateX(-30px);
            }
        }

        /* Small arrow indicators */
        .follow-arrow {
            animation: arrow-move 2s ease-in-out infinite;
            transform-origin: center center;
            transform-box: fill-box;
        }

        .fa2 {
            animation-delay: 0.5s;
        }

        .fa3 {
            animation-delay: 1.0s;
        }

        @keyframes arrow-move {
            0% {
                opacity: 0;
                transform: translateX(-15px);
            }

            40% {
                opacity: 0.8;
                transform: translateX(0);
            }

            100% {
                opacity: 0;
                transform: translateX(20px);
            }
        }
    </style>
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -10 1124 620" preserveAspectRatio="xMidYMid meet">
        <image class="follow-nose" href="/static/svg/nose.svg" x="398" y="312" />
        <image class="follow-body" href="/static/svg/idle.svg" x="110" y="40" />
        <image class="follow-eyes" href="/static/svg/normal.svg" x="330" y="120" />

        <!-- Speed motion lines (left side, behind piggy) -->
        <line class="speed-line" x1="60" y1="220" x2="140" y2="220" stroke="rgba(139,92,246,0.5)" stroke-width="4"
            stroke-linecap="round" />
        <line class="speed-line sl2" x1="40" y1="300" x2="130" y2="300" stroke="rgba(139,92,246,0.45)" stroke-width="3"
            stroke-linecap="round" />
        <line class="speed-line sl3" x1="70" y1="380" x2="150" y2="380" stroke="rgba(139,92,246,0.4)" stroke-width="3.5"
            stroke-linecap="round" />
        <line class="speed-line sl4" x1="50" y1="460" x2="120" y2="460" stroke="rgba(139,92,246,0.35)" stroke-width="3"
            stroke-linecap="round" />
        <line class="speed-line sl5" x1="80" y1="160" x2="155" y2="160" stroke="rgba(139,92,246,0.4)" stroke-width="3"
            stroke-linecap="round" />

        <!-- Small chevron arrows (right side, direction of movement) -->
        <g class="follow-arrow">
            <polyline points="830,260 855,280 830,300" fill="none" stroke="rgba(139,92,246,0.6)" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="follow-arrow fa2">
            <polyline points="870,260 895,280 870,300" fill="none" stroke="rgba(139,92,246,0.45)" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="follow-arrow fa3">
            <polyline points="910,260 935,280 910,300" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <!-- Tracking crosshair on piggy's left eye (purple) -->
        <g class="crosshair">
            <!-- Outer ring -->
            <circle cx="627" cy="295" r="35" fill="none" stroke="rgba(139,92,246,0.6)" stroke-width="2.5" />
            <!-- Inner ring -->
            <circle cx="627" cy="295" r="15" fill="none" stroke="rgba(139,92,246,0.7)" stroke-width="2" />
            <!-- Cross lines -->
            <line x1="627" y1="250" x2="627" y2="278" stroke="rgba(139,92,246,0.6)" stroke-width="2" />
            <line x1="627" y1="312" x2="627" y2="340" stroke="rgba(139,92,246,0.6)" stroke-width="2" />
            <line x1="582" y1="295" x2="610" y2="295" stroke="rgba(139,92,246,0.6)" stroke-width="2" />
            <line x1="644" y1="295" x2="672" y2="295" stroke="rgba(139,92,246,0.6)" stroke-width="2" />
            <!-- Center dot -->
            <circle cx="627" cy="295" r="3" fill="rgba(139,92,246,0.8)" />
        </g>
    </svg>
</body>

</html>
