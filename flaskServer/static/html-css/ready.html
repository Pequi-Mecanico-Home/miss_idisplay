<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>ready</title>
    <style>
        .sparkle {
            animation: twinkle 2.8s ease-in-out infinite;
            transform-origin: center center;
            transform-box: fill-box;
        }
        .s2 { animation-delay: 0.5s; }
        .s3 { animation-delay: 1.0s; }
        .s4 { animation-delay: 1.5s; }
        .s5 { animation-delay: 2.0s; }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.5) rotate(0deg); }
            30% { opacity: 1; transform: scale(1.3) rotate(15deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(-10deg); }
            70% { opacity: 0.8; transform: scale(1.1) rotate(5deg); }
        }
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -10 1124 620" preserveAspectRatio="xMidYMid meet">
        <image class="nose" href="/static/svg/nose.svg" x="398" y="312"/>
        <image class="idle" href="/static/svg/idle.svg" x="110" y="40"/>
        <image class="normal" href="/static/svg/normal.svg" x="330" y="120"/>

        <!-- Sparkle effects scattered around piggy -->
        <polygon class="sparkle" points="280,110 286,124 300,124 289,133 292,147 280,138 268,147 271,133 260,124 274,124" fill="rgba(34,197,94,0.8)"/>
        <polygon class="sparkle s2" points="730,90 735,101 746,101 737,108 740,119 730,112 720,119 723,108 714,101 725,101" fill="rgba(34,197,94,0.7)"/>
        <polygon class="sparkle s3" points="800,270 804,279 813,279 806,284 808,293 800,288 792,293 794,284 787,279 796,279" fill="rgba(34,197,94,0.6)"/>
        <polygon class="sparkle s4" points="200,320 205,331 216,331 207,338 210,349 200,342 190,349 193,338 184,331 195,331" fill="rgba(34,197,94,0.65)"/>
        <polygon class="sparkle s5" points="680,420 684,429 693,429 686,434 688,443 680,438 672,443 674,434 667,429 676,429" fill="rgba(34,197,94,0.55)"/>
    </svg>
</body>
</html>
