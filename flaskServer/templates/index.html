<!-- 

This HTML file sets up a simple web page that uses Flask-SocketIO to dynamically update an iframe's content. 

- The <head> section includes:
    - A title for the page.
    - A script tag to include the Socket.IO library from a CDN.
    - An inline script that:
        - Waits for the DOM to be fully loaded before running.
        - Establishes a WebSocket connection using Socket.IO.
        - Listens for the 'html_updated' event from the server.
        - Updates the iframe's source to the new HTML content received from the server.

- The <body> section includes:
    - An iframe that initially loads a static HTML file.
    - Inline styles to ensure the iframe takes up the full viewport and is centered.
    - A layout structure optimized for clear state indication and subtitles visibility.
-->
<!DOCTYPE html>
<html>

<head>
    <title>miss interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- We use a javascript to do the eventhandler along side with the socketIO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        /* --- 1. MISS PIGGY DISPLAY (Full Screen) --- */
        #iframe {
            border: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- 2. STATE HEADER (Top Overlay) --- */
        #state-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: var(--state-color, transparent);
            box-shadow: 0 4px 24px var(--state-glow, transparent);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease, background-color 0.5s ease;
            z-index: 100;
        }

        #state-header.active {
            opacity: 1;
        }

        .state-text-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #state-label {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 50px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.95);
        }

        .pulse-dot {
            width: 25px;
            height: 25px;
            background-color: #fff;
            border-radius: 50%;
            animation: pulse-dot-anim 2.0s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        @keyframes pulse-dot-anim {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(0.5);
                opacity: 0.4;
            }
        }

        /* --- 3. SUBTITLES FOOTER (Bottom Overlay) --- */
        .footer-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 40px 40px 20px 40px;
            z-index: 200;
            pointer-events: none;
        }

        .subtitle-text {
            width: 100%;
            text-align: center;
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.3vw;
            font-weight: bold;
            text-shadow: -0.2vw -0.2vw 0 #000, 0.2vw -0.2vw 0 #000, -0.2vw 0.2vw 0 #000, 0.2vw 0.2vw 0 #000;
            min-height: 4vw;
        }

        /* --- Operator Caption --- */
        #subtitle_human {
            color: rgba(209, 213, 219, 0.95);
            font-size: 3.2vw;
            margin-bottom: 0.5vw;
        }

        #subtitle_human::before {
            content: "Operator: ";
            color: rgba(255, 255, 255, 0.5);
            font-weight: 800;
        }

        /* --- Miss Piggy Caption --- */
        #subtitle_robot {
            color: rgba(255, 255, 255, 0.95);
        }

        #subtitle_robot::before {
            content: "Miss Piggy: ";
            color: rgba(34, 211, 238, 0.95);
            font-weight: 800;
        }

        #subtitle_human:empty::before,
        #subtitle_robot:empty::before {
            content: none;
        }
    </style>

    <script type="text/javascript" charset="utf-8">
        const STATE_CONFIG = {
            listening: { color: 'rgba(139, 92, 246, 0.82)', glow: 'rgba(139, 92, 246, 0.4)', label: 'LISTENING', face: 'listening' },
            thinking: { color: 'rgba(59, 130, 246, 0.82)', glow: 'rgba(59, 130, 246, 0.4)', label: 'THINKING', face: 'thinking' },
            ready: { color: 'rgba(34, 197, 94, 0.82)', glow: 'rgba(34, 197, 94, 0.4)', label: 'READY', face: 'ready' },
            talking: { color: 'rgba(6, 182, 212, 0.82)', glow: 'rgba(6, 182, 212, 0.4)', label: 'TALKING', face: 'talking' },
            navigating: { color: 'rgba(245, 158, 11, 0.82)', glow: 'rgba(245, 158, 11, 0.4)', label: 'NAVIGATING', face: 'navigation' },
            grabbing: { color: 'rgba(249, 115, 22, 0.82)', glow: 'rgba(249, 115, 22, 0.4)', label: 'GRABBING', face: 'grabbing' },
            placing: { color: 'rgba(236, 72, 153, 0.82)', glow: 'rgba(236, 72, 153, 0.4)', label: 'PLACING', face: 'placing' },
            help: { color: 'rgba(234, 179, 8, 0.82)', glow: 'rgba(234, 179, 8, 0.4)', label: 'HELP', face: 'help' },
            error: { color: 'rgba(239, 68, 68, 0.82)', glow: 'rgba(239, 68, 68, 0.4)', label: 'ERROR', face: 'error' },
            scanning: { color: 'rgba(16, 185, 129, 0.82)', glow: 'rgba(16, 185, 129, 0.4)', label: 'SCANNING', face: 'scanning' },
            following: { color: 'rgba(99, 102, 241, 0.82)', glow: 'rgba(99, 102, 241, 0.4)', label: 'FOLLOWING', face: 'following' },
            pointing: { color: 'rgba(197, 197, 197, 0.82)', glow: 'rgba(197, 197, 197, 0.4)', label: 'POINTING', face: 'pointing' }
        };

        function setStateBorder(state) {
            const header = document.getElementById('state-header');
            const iframe = document.getElementById('iframe');
            const labelEl = document.getElementById('state-label');

            if (!state || state === 'idle' || state === 'normal') {
                header.classList.remove('active');
                iframe.src = '../static/html-css/normal.html';
                return;
            }

            const config = STATE_CONFIG[state];
            if (!config) return;

            header.style.setProperty('--state-color', config.color);
            header.style.setProperty('--state-glow', config.glow);

            labelEl.innerText = config.label;

            header.classList.add('active');
            iframe.src = '../static/html-css/' + config.face + '.html';
        }

        // Using the event listener to ensure that the script only runs after the html be fully loaded and parsed
        document.addEventListener('DOMContentLoaded', () => {
            // Stablishing the connection through WebSocket with io()
            const socket = io();

            // Listens to html_updated and receive a message object
            socket.on('html_updated', function (msg) {
                // reloads the iframe with the updated HTML content
                document.getElementById('iframe').src = '../static/html-css/' + msg.data + '.html';
            });

            socket.on('state_changed', function (msg) {
                setStateBorder(msg.state);
            });

            // --- Subtitle Queue System ---
            // Messages are queued and played one at a time per channel.
            const humanQueue = [];
            const robotQueue = [];
            let humanBusy = false;
            let robotBusy = false;

            function processQueue(queue, busyFlag, subtitleDiv, holdTime) {
                if (queue.length === 0) {
                    // Set the busy flag to false on the correct variable
                    if (subtitleDiv.id === 'subtitle_human') humanBusy = false;
                    else robotBusy = false;
                    return;
                }

                const message = queue.shift();
                const words = message.split(' ');
                let index = 0;
                subtitleDiv.innerHTML = '';

                const displayNextWord = () => {
                    if (index < words.length) {
                        const currentWords = words.slice(0, index + 1).join(' ');
                        const lines = currentWords.split('\n');
                        const lastLine = lines[lines.length - 1];
                        const wordCount = lastLine.split(' ').length;
                        if (wordCount % 10 === 0) {
                            subtitleDiv.innerHTML = subtitleDiv.innerHTML.trim() + '<br>';
                        }
                        subtitleDiv.innerHTML = subtitleDiv.innerHTML.split('<br>').slice(-2).join('<br>');
                        subtitleDiv.innerHTML += words[index] + ' ';
                        index++;
                        setTimeout(displayNextWord, 200);
                    } else {
                        // Hold the text visible, then clear and process next in queue
                        setTimeout(() => {
                            subtitleDiv.innerHTML = '';
                            processQueue(queue, busyFlag, subtitleDiv, holdTime);
                        }, holdTime);
                    }
                };
                displayNextWord();
            }

            socket.on('subtitle_human', (message) => {
                const subtitleDiv = document.getElementById('subtitle_human');
                humanQueue.push(message);
                if (!humanBusy) {
                    humanBusy = true;
                    processQueue(humanQueue, humanBusy, subtitleDiv, 4000);
                }
            });

            socket.on('subtitle_robot', (message) => {
                const subtitleDiv = document.getElementById('subtitle_robot');
                robotQueue.push(message);
                if (!robotBusy) {
                    robotBusy = true;
                    processQueue(robotQueue, robotBusy, subtitleDiv, 6000);
                }
            });
        });
    </script>
</head>

<body>

    <!-- 1. Center Area for Miss Piggy (Full Screen behind everything) -->
    <iframe id="iframe" src="../static/html-css/normal.html"></iframe>

    <!-- 2. Top Header for State Display -->
    <div id="state-header">
        <div class="state-text-container">
            <div class="pulse-dot"></div>
            <div id="state-label"></div>
        </div>
    </div>

    <!-- 3. Bottom Footer for Subtitles -->
    <div class="footer-area">
        <div id="subtitle_human" class="subtitle-text"></div>
        <div id="subtitle_robot" class="subtitle-text"></div>
    </div>

</body>

</html>
